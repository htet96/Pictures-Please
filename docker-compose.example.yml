services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      - DATABASE_URL=postgresql://photogallery:${DB_PASSWORD}@db:5432/photogallery?schema=public
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - SESSION_SECRET=${SESSION_SECRET}
      - FAVICON_URL=${FAVICON_URL:-}
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=3000
    volumes:
      - photo_data:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=photogallery
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=photogallery
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U photogallery"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  photo_data:
  pg_data:
